name: update

on:
  # Every Monday 04:37 UTC (= Beijing Monday 12:37)
  schedule:
    - cron: "37 4 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag to build (empty = latest plain tag)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Resolve upstream tag
        id: resolve
        run: |
          set -eu
          if [ -n "${{ inputs.version }}" ]; then
            TAG="$(printf '%s' "${{ inputs.version }}" | tr -d '[:space:]')"
            echo "using manually supplied tag: $TAG"
          else
            TAG="$(./scripts/resolve-tag.sh)"
            echo "resolved latest plain tag: $TAG"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream source (git tag tarball)
        run: ./scripts/fetch-source.sh "${{ steps.resolve.outputs.TAG }}" build/src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/sebrinass/free-model-docker:${{ steps.resolve.outputs.TAG }},ghcr.io/sebrinass/free-model-docker:latest
          cache-from: type=gha
          cache-to: type=gha

      - name: Load image locally for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ofm-smoke:local
          cache-from: type=gha

      - name: Smoke test (in-container loopback health probe)
        run: |
          set -eu
          docker rm -f ofm-smoke 2>/dev/null || true
          docker run -d --name ofm-smoke ofm-smoke:local
          # Startup can take 10-30s+ (upstream model list fetch); probe with retries.
          # 18900 is loopback-only inside the container, so probe via docker exec.
          sleep 20
          ok=0
          for i in $(seq 1 16); do
            if docker exec ofm-smoke node -e 'fetch("http://127.0.0.1:18900/health").then(async (r) => { const t = await r.text(); console.log(r.status, t); process.exit(r.ok ? 0 : 1) }).catch((e) => { console.error(e); process.exit(1) })'; then
              ok=1
              break
            fi
            echo "health probe $i failed, retrying in 5s..."
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "smoke test FAILED - dumping container logs"
            docker logs ofm-smoke || true
            exit 1
          fi
          echo "--- container logs ---"
          docker logs ofm-smoke || true

      - name: Make GHCR package public
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --method PATCH "/user/packages/container/free-model-docker" -f visibility=public; then
            echo "GHCR package visibility set to public"
          else
            echo "::warning::Could not set GHCR package visibility automatically. Set it manually: repo Settings -> Packages -> free-model-docker -> public."
          fi
